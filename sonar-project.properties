sonar.projectKey=mateusz-klatt_snapper-ios
sonar.organization=mateusz-klatt

sonar.host.url=https://sonarcloud.io

sonar.sources=Snapper
sonar.tests=SnapperTests

sonar.exclusions=Snapper/Models/Generated/**,build/**,scripts/**
# Coverage exclusions documented in docs/architecture-mvvm.md
# (Q4 hybrid path → Strategy A enacted in v0.3.1):
#  - Generated code: untestable auto-generated structs.
#  - SnapperTests: industry standard (test code does not count to coverage).
#  - Snapper/Views/**: post-MVVM, View files are SwiftUI body chrome
#    (declarative layout); business logic lives in @Observable
#    ViewModels at Snapper/ViewModels/. View bodies are not unit-
#    testable without ViewInspector — explicitly rejected by
#    architect consensus.
#  - Snapper/SnapperApp.swift: app-entry / scene-phase wiring is
#    not unit-testable without UIApplication harness.
sonar.coverage.exclusions=Snapper/Models/Generated/**,SnapperTests/**,Snapper/Views/**,Snapper/SnapperApp.swift

sonar.coverageReportPaths=build/sonarqube-generic-coverage.xml

sonar.sourceEncoding=UTF-8

# Issue ignores documented per rule:
# - swift:S1186 (empty closure body) on SwiftUI Preview / alert /
#   binding stubs: the production sites in LoginView and
#   SettingsView do real work; preview/test no-op closures are
#   intentional and named explicitly via private helpers (see
#   BackendURLEditor.Container, SettingsView.dismissBackendChangeAlert,
#   BackendURLEditorTests.discardSavedURL). Sonar's accept-via-comment
#   workaround conflicts with the project's no-comments rule, so the
#   issues are suppressed at config level instead.
# - swift:S1075 (hardcoded URI) on documented constants:
#   BackendURLEditor.inputPlaceholder is UX placeholder text (never
#   used as a connection target) and BackendURLStore.compiledInFallbackURLString
#   is the dev-only fallback when Configuration.plist fails to load.
#   Both are intentional design constants exposed via a named static.
# - swift:S2068 (hardcoded credential) on LoginViewModel.swift: the
#   match is the SwiftUI `@State` `password` binding (default empty)
#   and its `private(set) var password` accessor; both are intended
#   form-input state, not a stored secret. Marked False-Positive in
#   the SonarCloud UI historically; lifting the rule into config so
#   the mark survives line-number drift across releases.
# - swift:S7435 (identifierForVendor privacy) on
#   DeviceRegistrationService.swift: identifierForVendor is the
#   Apple-recommended privacy-friendly device identifier and is
#   declared in PrivacyInfo.xcprivacy under the
#   "DeviceID — DeviceID Required Reason API" entry. The rule is
#   over-broad for compliant uses; suppressing per file.
sonar.issue.ignore.multicriteria=swiftPreviewEmptyClosure,swiftAlertDismissNoOp,swiftPlaceholderURI,swiftFallbackURI,swiftLoginPasswordBinding,swiftIdentifierForVendor
sonar.issue.ignore.multicriteria.swiftPreviewEmptyClosure.ruleKey=swift:S1186
sonar.issue.ignore.multicriteria.swiftPreviewEmptyClosure.resourceKey=Snapper/Views/Components/BackendURLEditor.swift
sonar.issue.ignore.multicriteria.swiftAlertDismissNoOp.ruleKey=swift:S1186
sonar.issue.ignore.multicriteria.swiftAlertDismissNoOp.resourceKey=Snapper/Views/SettingsView.swift
sonar.issue.ignore.multicriteria.swiftPlaceholderURI.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.swiftPlaceholderURI.resourceKey=Snapper/Views/Components/BackendURLEditor.swift
sonar.issue.ignore.multicriteria.swiftFallbackURI.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.swiftFallbackURI.resourceKey=Snapper/Config/BackendURLStore.swift
sonar.issue.ignore.multicriteria.swiftLoginPasswordBinding.ruleKey=swift:S2068
sonar.issue.ignore.multicriteria.swiftLoginPasswordBinding.resourceKey=Snapper/ViewModels/LoginViewModel.swift
sonar.issue.ignore.multicriteria.swiftIdentifierForVendor.ruleKey=swift:S7435
sonar.issue.ignore.multicriteria.swiftIdentifierForVendor.resourceKey=Snapper/Services/DeviceRegistrationService.swift
