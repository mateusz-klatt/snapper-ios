name: i18n-screenshots

# Opt-in workflow that runs the SnapperUITests screenshot harness across 45
# AppLocale codes, attaching every PNG to the xcresult bundle. NOT triggered
# automatically on push/PR — these runs require a live backend tunnel and
# take ~20 min, so they run only on explicit manual dispatch.
#
# To run:
#   - GitHub UI: Actions → i18n-screenshots → Run workflow → paste backend URL.
#   - gh CLI: gh workflow run i18n-screenshots -f backend_url=https://your-tunnel
#
# The default test run in ci.yml skips the SnapperUITests target while the
# checked-in backend URL remains the invalid sentinel.

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Live backend URL (cloudflared tunnel or staging). Required.'
        required: true
        type: string
      capture_mode:
        description: 'Non-mutating screenshot capture mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - retry
          - showcase
          - chart-verify

concurrency:
  group: i18n-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: i18n screenshot capture
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SNAPPER_SCREENSHOT_CAPTURE_MODE: ${{ inputs.capture_mode }}
      SNAPPER_UITEST_BACKEND_URL: ${{ inputs.backend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show Xcode + simulator state
        run: |
          xcodebuild -version
          xcrun simctl list devices available iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: make setup

      - name: Run screenshot capture
        run: bash scripts/screenshot-all-locales.sh "$SNAPPER_SCREENSHOT_CAPTURE_MODE"

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: i18n-screenshots-xcresult
          path: build/screenshots.xcresult
          retention-days: 14
