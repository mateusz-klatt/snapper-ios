name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Show Xcode + simulator state
        run: |
          xcodebuild -version
          xcrun simctl list devices available iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: make build

      - name: Test
        run: make test
